<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Base red from --orb (light) token in css/tokens.css: #E5323F -->
    <radialGradient id="orb" cx="0.35" cy="0.35" r="0.75" fx="0.35" fy="0.35">
      <stop offset="0%"   stop-color="#F05868"/>
      <stop offset="50%"  stop-color="#E5323F"/>
      <stop offset="100%" stop-color="#B01828"/>
    </radialGradient>
  </defs>
  <!-- Filled orb circle -->
  <circle cx="16" cy="16" r="10" fill="url(#orb)"/>
  <!-- Thin orbit ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#E5323F" stroke-width="1.25" stroke-opacity="0.45"/>
  <!-- Orbit dot at ~4:30 (135° clockwise from 12) — near-white from --text dark token #F0F0FF -->
  <circle cx="25.9" cy="25.9" r="2.25" fill="#F0F0FF"/>
</svg>
